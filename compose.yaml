name: tsv-lineage

services:
  builder:
    platform: linux/amd64
    build:
      context: .
      args:
        BUILDER_UID: ${HOST_UID:-1000}
        BUILDER_GID: ${HOST_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    volumes:
      - source:/android
      - home:/home/builder
      - cache:/cache
      - .:/integration

volumes:
  source:
  home:
  cache:
