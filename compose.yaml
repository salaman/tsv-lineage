name: tsv-lineage

services:
  builder:
    platform: linux/amd64
    build:
      context: .
      args:
        BUILDER_UID: ${HOST_UID:-1000}
        BUILDER_GID: ${HOST_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    mem_limit: 30g
    environment:
      SOONG_MEMORY_LIMIT_GIB: ${SOONG_MEMORY_LIMIT_GIB:-20}
    volumes:
      - source:/android
      - home:/home/builder
      - cache:/cache
      - .:/integration

volumes:
  source:
  home:
  cache:
